name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number, e.g. 1.2.3
        required: true
        type: string
      release_type:
        description: Release type
        required: true
        default: stable
        type: choice
        options:
          - stable
          - prerelease
      build_commit:
        description: Existing native-build commit SHA to reuse (optional; defaults to the tag or workflow commit)
        required: false
        type: string
  release:
    types:
      - published

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.release.body || '', '<!-- manual-release -->') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
            version="${version#v}"
            if [ "${{ github.event.release.prerelease }}" = "true" ]; then
              release_type="prerelease"
            else
              release_type="stable"
            fi
          else
            version="${{ inputs.version }}"
            release_type="${{ inputs.release_type }}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_type=${release_type}" >> "$GITHUB_OUTPUT"

      - name: Resolve successful workflow runs for build commit
        id: resolve_runs
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function findSuccessfulRunForCommit(workflowFile) {
              const res = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: workflowFile,
                branch: "main",
                status: "completed",
                per_page: 100,
              });

              const run = res.data.workflow_runs.find((workflowRun) =>
                workflowRun.conclusion === "success" && workflowRun.head_sha === targetCommit
              );
              if (!run) {
                throw new Error(
                  `No successful run found for ${workflowFile} at build commit ${targetCommit}`
                );
              }

              core.info(`Selected ${workflowFile} run: ${run.id} (${run.html_url})`);
              return String(run.id);
            }

            async function findArtifactId(runId, artifactName) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: Number(runId),
                per_page: 100,
              });

              const artifact = artifacts.data.artifacts.find((a) => a.name === artifactName && !a.expired);
              if (!artifact) {
                throw new Error(`Artifact '${artifactName}' not found (or expired) in run ${runId}`);
              }

              core.info(`Selected artifact ${artifactName}: ${artifact.id}`);
              return String(artifact.id);
            }

            let targetCommit;
            if (context.eventName === "release") {
              targetCommit = (await github.rest.repos.getCommit({
                owner,
                repo,
                ref: context.payload.release.tag_name,
              })).data.sha;
            } else {
              const requestedBuildCommit = `${{ inputs.build_commit }}`.trim();
              if (requestedBuildCommit) {
                targetCommit = (await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: requestedBuildCommit,
                })).data.sha;
                core.info(`Explicit build commit ${requestedBuildCommit} resolves to ${targetCommit}; reusing its native artifacts.`);
              } else {
                const requestedTag = `v${{ steps.release_meta.outputs.version }}`;
                try {
                  targetCommit = (await github.rest.repos.getCommit({
                    owner,
                    repo,
                    ref: requestedTag,
                  })).data.sha;
                  core.info(`Existing tag ${requestedTag} resolves to ${targetCommit}; reusing its build artifacts.`);
                } catch (error) {
                  if (error.status !== 404 && error.status !== 422) throw error;
                  targetCommit = context.sha;
                  core.info(`Tag ${requestedTag} does not exist yet and no build_commit was supplied; using workflow commit ${targetCommit}.`);
                }
              }
            }
            core.info(`Release build commit: ${targetCommit}`);
            core.setOutput("build_commit", targetCommit);

            const linuxRunId = await findSuccessfulRunForCommit("linux_x64_portable.yml");
            const windowsRunId = await findSuccessfulRunForCommit("windows_x64_portable.yml");
            const macosRunId = await findSuccessfulRunForCommit("macos_portable.yml");
            core.setOutput("linux_run_id", linuxRunId);
            core.setOutput("windows_run_id", windowsRunId);
            core.setOutput("macos_run_id", macosRunId);

            async function safeFindArtifactId(runId, artifactName) {
              try { return await findArtifactId(runId, artifactName); } catch (e) { return null; }
            }

            const artifactsToFind = [
              { runId: linuxRunId, name: "desktop-portable-linux-x64-full", out: "linux_portable_full" },
              { runId: windowsRunId, name: "desktop-portable-win-x64-full", out: "win_portable_full" },
              { runId: macosRunId, name: "desktop-portable-macos-x64-full", out: "mac_x64_portable_full" },
              { runId: macosRunId, name: "desktop-portable-macos-arm64-full", out: "mac_arm64_portable_full" },
              { runId: linuxRunId, name: "desktop-installer-linux-x64-lite-deb", out: "linux_lite_deb" },
              { runId: linuxRunId, name: "desktop-installer-linux-x64-full-deb", out: "linux_full_deb" },
              { runId: linuxRunId, name: "desktop-installer-linux-x64-lite-rpm", out: "linux_lite_rpm" },
              { runId: linuxRunId, name: "desktop-installer-linux-x64-full-rpm", out: "linux_full_rpm" },
              { runId: windowsRunId, name: "desktop-installer-win-x64-lite-exe", out: "win_lite_exe" },
              { runId: windowsRunId, name: "desktop-installer-win-x64-full-exe", out: "win_full_exe" },
              { runId: macosRunId, name: "desktop-installer-macos-x64-lite-pkg", out: "mac_x64_lite_pkg" },
              { runId: macosRunId, name: "desktop-installer-macos-x64-full-pkg", out: "mac_x64_full_pkg" },
              { runId: macosRunId, name: "desktop-installer-macos-arm64-lite-pkg", out: "mac_arm64_lite_pkg" },
              { runId: macosRunId, name: "desktop-installer-macos-arm64-full-pkg", out: "mac_arm64_full_pkg" }
            ];

            for (const a of artifactsToFind) {
              const id = await safeFindArtifactId(a.runId, a.name);
              if (id) core.setOutput(a.out, id);
            }

      - name: Prepare user-facing release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-assets artifact-zips artifact-unpacked

          download_artifact_zip() {
            local id="$1"
            local output="$2"
            if [ -z "$id" ]; then
              return 1
            fi
            curl --fail --retry 3 --retry-delay 2 --retry-all-errors -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "$output"
          }

          keep_portable_zip() {
            local id="$1"
            local output_name="$2"
            if [ -z "$id" ]; then
              return 0
            fi
            download_artifact_zip "$id" "release-assets/$output_name"
          }

          extract_installer() {
            local id="$1"
            local pattern="$2"
            local output_name="$3"
            if [ -z "$id" ]; then
              return 0
            fi

            local zip_path="artifact-zips/$output_name.zip"
            local unpack_dir="artifact-unpacked/$output_name"
            mkdir -p "$unpack_dir"
            download_artifact_zip "$id" "$zip_path"
            unzip -q "$zip_path" -d "$unpack_dir"

            mapfile -d '' matches < <(find "$unpack_dir" -type f -name "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one $pattern in artifact $id, found ${#matches[@]}"
              find "$unpack_dir" -maxdepth 5 -type f -print
              exit 1
            fi

            cp "${matches[0]}" "release-assets/$output_name"
          }

          v="${{ steps.release_meta.outputs.version }}"

          keep_portable_zip "${{ steps.resolve_runs.outputs.linux_portable_full }}" \
            "seal-desktop-linux-x64-portable-full-v${v}.zip"
          keep_portable_zip "${{ steps.resolve_runs.outputs.win_portable_full }}" \
            "seal-desktop-windows-x64-portable-full-v${v}.zip"
          keep_portable_zip "${{ steps.resolve_runs.outputs.mac_x64_portable_full }}" \
            "seal-desktop-macos-x64-portable-full-v${v}.zip"
          keep_portable_zip "${{ steps.resolve_runs.outputs.mac_arm64_portable_full }}" \
            "seal-desktop-macos-arm64-portable-full-v${v}.zip"

          extract_installer "${{ steps.resolve_runs.outputs.linux_lite_deb }}" "*.deb" \
            "seal-desktop-linux-x64-installer-lite-v${v}.deb"
          extract_installer "${{ steps.resolve_runs.outputs.linux_full_deb }}" "*.deb" \
            "seal-desktop-linux-x64-installer-full-v${v}.deb"
          extract_installer "${{ steps.resolve_runs.outputs.linux_lite_rpm }}" "*.rpm" \
            "seal-desktop-linux-x64-installer-lite-v${v}.rpm"
          extract_installer "${{ steps.resolve_runs.outputs.linux_full_rpm }}" "*.rpm" \
            "seal-desktop-linux-x64-installer-full-v${v}.rpm"

          extract_installer "${{ steps.resolve_runs.outputs.win_lite_exe }}" "*.exe" \
            "seal-desktop-windows-x64-installer-lite-v${v}.exe"
          extract_installer "${{ steps.resolve_runs.outputs.win_full_exe }}" "*.exe" \
            "seal-desktop-windows-x64-installer-full-v${v}.exe"

          extract_installer "${{ steps.resolve_runs.outputs.mac_x64_lite_pkg }}" "*.pkg" \
            "seal-desktop-macos-x64-installer-lite-v${v}.pkg"
          extract_installer "${{ steps.resolve_runs.outputs.mac_x64_full_pkg }}" "*.pkg" \
            "seal-desktop-macos-x64-installer-full-v${v}.pkg"
          extract_installer "${{ steps.resolve_runs.outputs.mac_arm64_lite_pkg }}" "*.pkg" \
            "seal-desktop-macos-arm64-installer-lite-v${v}.pkg"
          extract_installer "${{ steps.resolve_runs.outputs.mac_arm64_full_pkg }}" "*.pkg" \
            "seal-desktop-macos-arm64-installer-full-v${v}.pkg"

          echo "Prepared release assets:"
          ls -lh release-assets

      - name: Record release provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          cat > release-assets/BUILD_PROVENANCE.txt <<EOF
          format_version=1
          release_version=${{ steps.release_meta.outputs.version }}
          release_type=${{ steps.release_meta.outputs.release_type }}
          build_commit=${{ steps.resolve_runs.outputs.build_commit }}
          linux_workflow_run=${{ steps.resolve_runs.outputs.linux_run_id }}
          windows_workflow_run=${{ steps.resolve_runs.outputs.windows_run_id }}
          macos_workflow_run=${{ steps.resolve_runs.outputs.macos_run_id }}
          EOF
          (
            cd release-assets
            sha256sum BUILD_PROVENANCE.txt seal-desktop-* > SHA256SUMS
          )
          cat release-assets/BUILD_PROVENANCE.txt
          cat release-assets/SHA256SUMS

      - name: Publish to GitHub Release (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.release_meta.outputs.version }}
          target_commitish: ${{ steps.resolve_runs.outputs.build_commit }}
          name: v${{ steps.release_meta.outputs.version }}
          prerelease: ${{ steps.release_meta.outputs.release_type == 'prerelease' }}
          make_latest: ${{ steps.release_meta.outputs.release_type == 'stable' }}
          body: |
            <!-- manual-release -->
          generate_release_notes: true
          overwrite_files: true
          files: |
            release-assets/*

      - name: Upload assets to existing release (release event)
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.release_meta.outputs.version }}
          prerelease: ${{ steps.release_meta.outputs.release_type == 'prerelease' }}
          make_latest: ${{ steps.release_meta.outputs.release_type == 'stable' }}
          overwrite_files: true
          files: |
            release-assets/*

      - name: Remove legacy wrapped release assets
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = `v${{ steps.release_meta.outputs.version }}`;
            const legacyToken = `-v${{ steps.release_meta.outputs.version }}-${{ steps.release_meta.outputs.release_type }}`;

            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.data.id,
              per_page: 100,
            });

            const legacyAssets = assets.filter((asset) =>
              asset.name.startsWith("seal-desktop-") &&
              asset.name.includes(legacyToken)
            );

            for (const asset of legacyAssets) {
              core.info(`Deleting legacy wrapped asset: ${asset.name}`);
              await github.rest.repos.deleteReleaseAsset({
                owner,
                repo,
                asset_id: asset.id,
              });
            }

            core.info(`Removed ${legacyAssets.length} legacy wrapped asset(s).`);