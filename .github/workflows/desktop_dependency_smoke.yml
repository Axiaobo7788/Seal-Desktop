name: desktop-dependency-download-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 3"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download-and-run-tools:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            os: ubuntu-latest
          - platform: windows
            arch: x64
            os: windows-latest
          - platform: macos
            arch: x64
            os: macos-15-intel
          - platform: macos
            arch: arm64
            os: macos-15

    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6

      - name: Test packaged tool integrity checks
        shell: bash
        run: python .github/scripts/test_verify_packaged_tools.py

      - name: Validate Windows packaging PowerShell syntax
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem .github/scripts -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List
              throw "PowerShell parse failed: $($_.Name)"
            }
          }

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          # Dependency probes do not require JetBrains Runtime. Temurin has
          # stable x64 and arm64 runner coverage and keeps this smoke focused.
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Test dependency ownership, cookies, paths, locales, and storage contracts
        shell: bash
        run: ./gradlew :desktop:test :shared:desktopTest --stacktrace

      - name: Verify JSON, dual-write, and SQLite storage on the native runner
        shell: bash
        run: |
          set -euo pipefail
          for backend in json dual sqlite; do
            ./gradlew :desktop:desktopStorageSelfCheck \
              "-PstorageBackend=$backend" "-PstorageStateDir=$RUNNER_TEMP/seal-storage-$backend" --stacktrace
          done

      - name: Download and execute application-managed dependencies
        shell: bash
        env:
          SEAL_DESKTOP_AUXILIARY_DIR: ${{ runner.temp }}/seal-dependency-smoke
        run: ./gradlew :desktop:desktopDependencyDownloadSelfCheck --stacktrace

      - name: Print downloaded binary metadata
        if: always()
        shell: bash
        env:
          SEAL_DESKTOP_AUXILIARY_DIR: ${{ runner.temp }}/seal-dependency-smoke
        run: |
          if [[ -d "$SEAL_DESKTOP_AUXILIARY_DIR" ]]; then
            find "$SEAL_DESKTOP_AUXILIARY_DIR" -maxdepth 1 -type f -print
            if command -v file >/dev/null 2>&1; then
              find "$SEAL_DESKTOP_AUXILIARY_DIR" -maxdepth 1 -type f -exec file {} \;
            fi
          fi
