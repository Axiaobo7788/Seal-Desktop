name: desktop-macos-portable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLS_CACHE_VERSION: v3
  DESKTOP_TARGET_FORMATS: pkg
  DESKTOP_RELEASE_PROGUARD: "true"
  YT_DLP_MACOS_URL: https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp_macos
  GITHUB_TOKEN: ${{ secrets.JB_TOKEN }}

jobs:
  build-macos-portable:
    strategy:
      matrix:
        include:
          - arch: x64
            os: macos-15-intel
            ffmpeg_url: https://www.osxexperts.net/ffmpeg80intel.zip
            ffprobe_url: https://www.osxexperts.net/ffprobe80intel.zip
          - arch: arm64
            os: macos-15
            ffmpeg_url: https://www.osxexperts.net/ffmpeg81arm.zip
            ffprobe_url: https://www.osxexperts.net/ffprobe81arm.zip

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          cache: gradle

      - name: Set tools cache epoch
        shell: bash
        run: echo "TOOLS_CACHE_EPOCH=$(date -u +%G-W%V)" >> "$GITHUB_ENV"

      - name: Verify release shrinker configuration
        shell: bash
        run: |
          release_proguard="$(./gradlew -q :desktop:printDesktopReleaseProguardEnabled)"
          echo "Desktop release ProGuard enabled: $release_proguard"
          [[ "$release_proguard" == "true" ]]

      - name: Cache tools (yt-dlp/ffmpeg)
        uses: actions/cache@v5
        with:
          path: dist-bin
          key: tools-${{ runner.os }}-${{ matrix.arch }}-${{ env.TOOLS_CACHE_EPOCH }}-${{ env.TOOLS_CACHE_VERSION }}

      - name: Download yt-dlp (macOS universal)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "dist-bin/yt-dlp_macos" ]; then
            echo "yt-dlp cache hit"
            exit 0
          fi

          download_with_retry() {
            local url="$1"
            local output="$2"
            curl --fail --retry 3 --retry-delay 2 --retry-all-errors -L "$url" -o "$output"
          }

          mkdir -p dist-bin
          download_with_retry "$YT_DLP_MACOS_URL" dist-bin/yt-dlp_macos
          chmod +x dist-bin/yt-dlp_macos

      - name: Download FFmpeg & FFprobe (macOS ${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "dist-bin/ffmpeg" ] && [ -f "dist-bin/ffprobe" ]; then
            echo "ffmpeg cache hit"
            exit 0
          fi

          download_with_retry() {
            local url="$1"
            local output="$2"
            curl --fail --retry 3 --retry-delay 2 --retry-all-errors -L "$url" -o "$output"
          }

          extract_binary() {
            local zip_path="$1"
            local binary_name="$2"
            local tmp_dir
            local candidate

            tmp_dir="$(mktemp -d)"
            unzip -o "$zip_path" -d "$tmp_dir" >/dev/null
            candidate="$(find "$tmp_dir" -type f -name "$binary_name" | head -n 1 || true)"

            if [ -z "$candidate" ]; then
              rm -rf "$tmp_dir"
              return 1
            fi

            cp "$candidate" "dist-bin/$binary_name"
            chmod +x "dist-bin/$binary_name"
            rm -rf "$tmp_dir"
            return 0
          }

          mkdir -p dist-bin

          echo "Downloading FFmpeg from ${{ matrix.ffmpeg_url }}"
          download_with_retry "${{ matrix.ffmpeg_url }}" dist-bin/ffmpeg.zip
          extract_binary dist-bin/ffmpeg.zip ffmpeg

          echo "Downloading FFprobe from ${{ matrix.ffprobe_url }}"
          download_with_retry "${{ matrix.ffprobe_url }}" dist-bin/ffprobe.zip
          extract_binary dist-bin/ffprobe.zip ffprobe

          rm -f dist-bin/ffmpeg.zip dist-bin/ffprobe.zip

      - name: Verify downloaded tools (macOS ${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          ./dist-bin/yt-dlp_macos --version
          ./dist-bin/ffmpeg -version | head -n 1
          ./dist-bin/ffprobe -version | head -n 1
          file dist-bin/yt-dlp_macos dist-bin/ffmpeg dist-bin/ffprobe
          expected_arch="${{ matrix.arch }}"
          for tool in dist-bin/ffmpeg dist-bin/ffprobe; do
            archs="$(lipo -archs "$tool")"
            if [[ "$expected_arch" == "x64" && "$archs" != *"x86_64"* ]]; then
              echo "$tool does not contain x86_64: $archs"
              exit 1
            fi
            if [[ "$expected_arch" == "arm64" && "$archs" != *"arm64"* ]]; then
              echo "$tool does not contain arm64: $archs"
              exit 1
            fi
          done

      - name: Build Lite installers (macOS ${{ matrix.arch }})
        shell: bash
        run: |
          ./gradlew :desktop:createReleaseDistributable --stacktrace
          ./gradlew :desktop:packageReleaseDistributionForCurrentOS --stacktrace

          mkdir -p dist-installers-lite
          cp desktop/build/compose/binaries/main-release/pkg/*.pkg dist-installers-lite/ || true

      - name: Smoke test Lite app and installed PKG (macOS ${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          smoke_app() {
            local app_bundle="$1"
            local label="$2"
            local executable
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Contents/Info.plist")"
            bash .github/scripts/smoke_unix_app_image.sh \
              "$app_bundle" "$app_bundle/Contents/MacOS/$executable" "$label" 12 true
          }

          app_bundle="$(find desktop/build/compose/binaries -type d -name '*.app' | head -n 1)"
          pkg="$(find dist-installers-lite -type f -name '*.pkg' | head -n 1)"
          [[ -n "$app_bundle" && -n "$pkg" ]]
          smoke_app "$app_bundle" "Lite app image (${{ matrix.arch }})"

          sudo rm -rf /Applications/Seal.app
          sudo installer -pkg "$pkg" -target /
          smoke_app /Applications/Seal.app "Installed Lite PKG (${{ matrix.arch }})"
          sudo rm -rf /Applications/Seal.app

      - name: Inject tools for Full version
        shell: bash
        run: |
          mkdir -p desktop/appResources/macos
          cp dist-bin/* desktop/appResources/macos/ || true
          rm -rf desktop/build/compose/binaries desktop/build/compose/tmp

      - name: Build Full installers and portable (macOS ${{ matrix.arch }})
        shell: bash
        run: |
          ./gradlew :desktop:createReleaseDistributable --stacktrace
          ./gradlew :desktop:packageReleaseDistributionForCurrentOS --stacktrace
          ./gradlew :desktop:packageUberJarForCurrentOS --stacktrace

          mkdir -p dist-installers-full
          cp desktop/build/compose/binaries/main-release/pkg/*.pkg dist-installers-full/ || true

      - name: Smoke test Full app, bundled tools, and installed PKG (macOS ${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          smoke_app() {
            local app_bundle="$1"
            local label="$2"
            local executable
            executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_bundle/Contents/Info.plist")"
            bash .github/scripts/smoke_unix_app_image.sh \
              "$app_bundle" "$app_bundle/Contents/MacOS/$executable" "$label" 12 true
          }

          app_bundle="$(find desktop/build/compose/binaries -type d -name '*.app' | head -n 1)"
          pkg="$(find dist-installers-full -type f -name '*.pkg' | head -n 1)"
          [[ -n "$app_bundle" && -n "$pkg" ]]

          for name in yt-dlp_macos ffmpeg ffprobe; do
            packaged_tool="$(find "$app_bundle" -type f -name "$name" | head -n 1)"
            if [[ -z "$packaged_tool" ]]; then
              echo "Bundled tool not found in app: $name"
              exit 1
            fi
            chmod +x "$packaged_tool"
          done
          smoke_app "$app_bundle" "Full app image (${{ matrix.arch }})"

          sudo rm -rf /Applications/Seal.app
          sudo installer -pkg "$pkg" -target /
          smoke_app /Applications/Seal.app "Installed Full PKG (${{ matrix.arch }})"
          sudo rm -rf /Applications/Seal.app

      - name: Print jpackage logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          log_dir="desktop/build/compose/logs/createReleaseDistributable"
          if [ -d "$log_dir" ]; then
            echo "=== jpackage logs under $log_dir ==="
            ls -lah "$log_dir"
            for f in "$log_dir"/*.txt; do
              [ -e "$f" ] || continue
              echo "----- $f (tail -n 200) -----"
              tail -n 200 "$f"
            done
          else
            echo "No jpackage log directory found: $log_dir"
          fi

      - name: Prepare Full, Lite, Min distributions (macOS ${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE"
          desktop_build="$workspace/desktop/build"

          if [ ! -d "$desktop_build" ]; then
            echo "Build directory not found: $desktop_build"
            exit 1
          fi

          # Locate app bundle
          app_bundle=$(find "$desktop_build/compose/binaries" -type d -name "*.app" | head -n 1 || true)
          if [ -z "$app_bundle" ] || [ ! -d "$app_bundle" ]; then
            echo "Cannot locate macOS .app bundle under $desktop_build/compose/binaries"
            exit 1
          fi
          echo "Resolved app bundle: $app_bundle"

          # Portable
          mkdir -p "$workspace/dist-portable"
          cp -R "$app_bundle" "$workspace/dist-portable/"
          echo "PORTABLE_DIR=$workspace/dist-portable" >> "$GITHUB_ENV"

      - name: Upload Portable Full artifact
        uses: actions/upload-artifact@v6
        with:
          name: desktop-portable-macos-${{ matrix.arch }}-full
          path: ${{ env.PORTABLE_DIR }}
          if-no-files-found: error
          retention-days: 20

      - name: Upload Lite PKG Installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: desktop-installer-macos-${{ matrix.arch }}-lite-pkg
          path: dist-installers-lite/*.pkg
          if-no-files-found: error
          retention-days: 20

      - name: Upload Full PKG Installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: desktop-installer-macos-${{ matrix.arch }}-full-pkg
          path: dist-installers-full/*.pkg
          if-no-files-found: error
          retention-days: 20
